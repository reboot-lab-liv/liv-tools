<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NISA 積立・取り崩しシミュレーター</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #f3f5f9;
    --card: #ffffff;
    --text: #1d2433;
    --muted: #6b7385;
    --line: #e3e7ef;
    --accent: #2563eb;
    --accent-soft: #e8f0fe;
    --orange: #ea7a1a;
    --danger: #d33a3a;
    --head1: #0f1b3d;
    --head2: #1f3b8a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
  }
  a { color: inherit; }

  /* ヘッダー */
  header {
    background: linear-gradient(120deg, var(--head1), var(--head2));
    color: #fff; padding: 18px 24px;
  }
  .head-inner { max-width: 1180px; margin: 0 auto; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .avatars { display: flex; }
  .avatars img {
    width: 52px; height: 52px; border-radius: 50%; background: #fff; object-fit: cover; object-position: top;
    border: 2px solid rgba(255,255,255,0.9); box-shadow: 0 2px 6px rgba(0,0,0,0.25);
  }
  .avatars img + img { margin-left: -10px; }
  .title .by { margin-top: 4px; font-size: 0.78em; opacity: 0.9; font-weight: 600; }
  .title h1 { margin: 0; font-size: 1.35em; letter-spacing: 0.02em; }
  .title p { margin: 2px 0 0; font-size: 0.85em; opacity: 0.8; }
  .yt {
    margin-left: auto; display: inline-flex; align-items: center; gap: 8px;
    background: #ff0033; color: #fff; text-decoration: none; font-weight: 700; font-size: 0.9em;
    padding: 9px 16px; border-radius: 999px; box-shadow: 0 2px 8px rgba(0,0,0,0.25);
  }
  .yt:hover { filter: brightness(1.08); }
  .yt svg { width: 18px; height: 18px; }

  /* レイアウト */
  .layout { display: flex; gap: 20px; padding: 20px; max-width: 1180px; margin: 0 auto; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 1px 3px rgba(16,24,40,0.06); }
  .sidebar { flex: 0 0 300px; padding: 18px 20px; align-self: flex-start; position: sticky; top: 20px; }
  .sidebar h2 { margin: 0 0 4px; font-size: 1em; }
  .lead { margin: 0 0 8px; font-size: 0.82em; color: var(--muted); line-height: 1.6; }
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 20px; }

  /* スライドバー */
  .field { margin: 18px 0; }
  .field label { display: flex; justify-content: space-between; align-items: baseline; font-size: 0.88em; font-weight: 600; }
  .field label b { color: var(--accent); font-size: 1.05em; }
  input[type=range] { width: 100%; margin-top: 8px; accent-color: var(--accent); cursor: pointer; }
  .best { margin-top: 22px; display: flex; align-items: flex-end; gap: 8px; }
  .best img { width: 64px; flex: none; }
  .bubble {
    position: relative; flex: 1; padding: 10px 12px; background: var(--accent-soft); border-radius: 12px;
    font-size: 0.82em; color: var(--text); line-height: 1.55;
  }
  .bubble::before {
    content: ""; position: absolute; left: -8px; bottom: 14px;
    border: 8px solid transparent; border-right-color: var(--accent-soft); border-left: 0;
  }
  .bubble .who { display: block; font-size: 0.85em; color: var(--muted); font-weight: 600; margin-bottom: 2px; }
  .bubble b { display: block; margin-top: 4px; color: var(--accent); font-size: 1.35em; }

  /* グラフ */
  .chart { padding: 16px 16px 8px; height: 520px; }
  .card-title { margin: 0 0 8px; font-size: 0.95em; font-weight: 700; }
  .chart-box { position: relative; height: calc(100% - 28px); }

  /* 数字 */
  .kpis { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  .kpi { padding: 14px 16px; }
  .kpi .k { font-size: 0.8em; color: var(--muted); }
  .kpi .v { margin-top: 4px; font-size: 1.4em; font-weight: 700; }
  .kpi .s { margin-top: 2px; font-size: 0.8em; color: var(--muted); }
  .kpi.main-kpi .v { color: var(--accent); }
  .kpi.bad .v { color: var(--danger); }
  .notes { padding: 12px 16px; font-size: 0.85em; color: var(--muted); line-height: 1.7; }
  .warn { color: var(--danger); font-weight: 600; }
  .caution { color: var(--text); font-weight: 600; }

  /* 表 */
  .table-card { padding: 16px; }
  .scroll { overflow: auto; max-height: 480px; border: 1px solid var(--line); border-radius: 10px; }
  table { width: 100%; border-collapse: collapse; font-size: 0.85em; }
  th, td { padding: 7px 10px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); }
  th { position: sticky; top: 0; background: #f7f9fc; color: var(--muted); font-weight: 600; }
  tr:nth-child(even) td { background: #fbfcfe; }
  .tag { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 0.85em; }
  .t-pay { background: #e8f0fe; color: #1d4ed8; }
  .t-done { background: #dcfce7; color: #15803d; }
  .t-hold { background: #f1f5f9; color: #475569; }
  .t-draw { background: #ffedd5; color: #c2410c; }
  .t-empty { background: #fee2e2; color: #b91c1c; }

  footer {
    background: linear-gradient(120deg, var(--head1), var(--head2)); color: rgba(255,255,255,0.85);
    text-align: center; font-size: 0.8em; padding: 18px 16px; line-height: 1.8; margin-top: 8px;
  }

  @media (max-width: 820px) {
    header { padding: 14px 16px; }
    .yt { margin-left: 0; }
    .layout { flex-direction: column; padding: 16px; }
    .sidebar { flex: none; position: static; width: 100%; }
    .chart { height: 400px; }
    .kpis { grid-template-columns: 1fr; }
  }
</style>
</head>

        <span class="who">相棒（Claude）</span>
        <span id="bestTalk"></span>
        <b id="bestV"></b>

  </aside>

  <main class="main">
    <section class="card chart">
      <p class="card-title">評価額の推移</p>
      <div class="chart-box"><canvas id="chart"></canvas></div>
    </section>

    <section class="kpis" id="kpis"></section>
    <section class="card notes" id="notes"></section>

    <section class="card table-card">
      <p class="card-title">1年ごとの表</p>
      <div class="scroll"><table id="table"></table></div>
    </section>
  </main>
</div>

<footer>入れた数字はどこにも送りません<br>&copy; 2026 会社員の再起動ラボ（リブ）</footer>

<script>
const LIMIT = 18000000;       // 生涯の上限
const YEAR_LIMIT = 3600000;   // 1年の上限
const END_AGE = 100;
let chart = null;

function yen(n) { return Math.round(n).toLocaleString() + " 円"; }
function man(n) { return Math.round(n / 10000).toLocaleString() + " 万円"; }
function val(id) { return Number(document.getElementById(id).value); }
function kpi(k, v, s, cls) {
  return "<div class='card kpi " + (cls || "") + "'><div class='k'>" + k + "</div><div class='v'>" + v + "</div><div class='s'>" + (s || "") + "</div></div>";
}
const TAGS = { "積立中": "t-pay", "積立終了": "t-done", "運用のみ": "t-hold", "取り崩し中": "t-draw", "尽きた": "t-empty" };

function showValues() {
  document.getElementById("monthlyV").textContent = man(val("monthly"));
  document.getElementById("rateV").textContent = val("rate").toFixed(1) + " %";
  document.getElementById("startYearV").textContent = val("startYear") + " 年";
  document.getElementById("startAgeV").textContent = val("startAge") + " 歳";
  document.getElementById("pensionAgeV").textContent = val("pensionAge") + " 歳";
  document.getElementById("withdrawV").textContent = man(val("withdraw"));
}

function calc() {
  showValues();
  const monthly = val("monthly");
  const r = val("rate") / 100 / 12;
  const startYear = val("startYear");
  const startAge = val("startAge");
  const pensionAge = val("pensionAge");
  const withdraw = val("withdraw");

  const totalMonths = Math.max(0, (END_AGE - startAge) * 12);
  const withdrawStart = (pensionAge - startAge) * 12;   // この月数を過ぎたら取り崩す

  let total = 0;
  let principal = 0;
  let withdrawn = 0;
  let doneMonth = 0, doneTotal = 0;     // 1,800万円を積み立て終わった月と、そのときの評価額
  let pensionTotal = null;              // 取り崩しを始める直前の評価額
  let emptyMonth = 0;                   // お金が尽きた月
  let rows = "<tr><th>西暦</th><th>年齢</th><th>状態</th><th>元本</th><th>取り崩し累計</th><th>評価額</th><th>運用益</th></tr>";
  let yearPaid = false, yearWithdrew = false;
  const labels = [], dataTotal = [], dataPrincipal = [], dataWithdrawn = [];

  for (let m = 1; m <= totalMonths; m++) {
    if (m - 1 >= withdrawStart) {
      // 取り崩し（積立はやめる）
      if (pensionTotal === null) pensionTotal = total;
      const out = Math.min(withdraw, total);
      total -= out;
      withdrawn += out;
      if (out > 0) yearWithdrew = true;
      if (total <= 0 && !emptyMonth) emptyMonth = m;
    } else {
      // 積立
      const pay = Math.min(monthly, LIMIT - principal);
      total += pay;
      principal += pay;
      if (pay > 0) yearPaid = true;
      if (!doneMonth && principal >= LIMIT) { doneMonth = m; }
    }
    total *= (1 + r);
    if (doneMonth === m) doneTotal = total;

    if (m % 12 === 0) {
      const y = m / 12;
      let state;
      if (emptyMonth) state = "尽きた";
      else if (yearWithdrew) state = "取り崩し中";
      else if (doneMonth && doneMonth > m - 12) state = "積立終了";
      else if (yearPaid) state = "積立中";
      else state = "運用のみ";
      rows += "<tr><td>" + (startYear + y - 1) + "</td><td>" + (startAge + y) + "</td><td><span class='tag " + TAGS[state] + "'>" + state + "</span></td><td>" + yen(principal) + "</td><td>" + yen(withdrawn) + "</td><td>" + yen(total) + "</td><td>" + yen(total + withdrawn - principal) + "</td></tr>";
      labels.push((startAge + y) + "歳");
      dataTotal.push(Math.round(total / 10000));
      dataPrincipal.push(Math.round(principal / 10000));
      dataWithdrawn.push(Math.round(withdrawn / 10000));
      yearPaid = false; yearWithdrew = false;
    }
  }

  // 数字のカード
  let cards = "";
  if (doneMonth) {
    const years = Math.floor(doneMonth / 12);
    const months = doneMonth % 12;
    const y = Math.ceil(doneMonth / 12);
    cards += kpi("1,800万円を積み立て終わるまで", years + " 年" + (months ? " " + months + " か月" : ""),
      (startYear + y - 1) + " 年ごろ・" + (startAge + y) + " 歳ごろ／評価額 " + man(doneTotal));
  } else {
    cards += kpi("1,800万円を積み立て終わるまで", "届かない", "取り崩しの前の元本 " + man(principal), "bad");
  }
  if (pensionTotal !== null) {
    cards += kpi(pensionAge + " 歳で取り崩しを始めるときの評価額", man(pensionTotal), yen(pensionTotal));
  }
  if (emptyMonth) {
    const age = startAge + Math.floor((emptyMonth - 1) / 12);
    cards += kpi("お金が尽きる年齢", age + " 歳ごろ", "取り崩し額を下げると延びます", "bad");
  } else {
    cards += kpi("100歳のときの評価額", man(total), yen(total), "main-kpi");
  }
  const best = bestWithdraw(pensionTotal, r, (END_AGE - pensionAge) * 12);
  document.getElementById("bestTalk").textContent = best === null ? "100歳までに取り崩しが始まらない条件です。" : "100歳までショートしないのは、毎月この額までです。";
  document.getElementById("bestV").textContent = best === null ? "" : yen(best);
  if (best !== null) {
    cards += kpi("100歳で資金がショートしない毎月の取り崩し額（最大）", man(best), "毎月 " + yen(best), "main-kpi");
  }
  document.getElementById("kpis").innerHTML = cards;

  let notes =
    "<span class='caution'>※ 利回りは例です。将来の運用成果を約束するものではありません。手数料と物価の上がり方は計算に入れていません。</span><br>" +
    "元本：" + yen(principal) + "｜取り崩した額の合計：" + yen(withdrawn) + "<br>" +
    "運用益：" + yen(total + withdrawn - principal) + "（NISA なので税金はかかりません）";
  if (monthly * 12 > YEAR_LIMIT) {
    notes += "<br><span class='warn'>1年に積み立てられるのは 360万円（毎月30万円）までです。</span>";
  }
  document.getElementById("notes").innerHTML = notes;
  document.getElementById("table").innerHTML = rows;
  drawChart(labels, dataTotal, dataPrincipal, dataWithdrawn);
}

// 取り崩しを始めるときの評価額 P から、毎月の初めに W を取り崩し、n か月後にちょうど 0 になる W
function bestWithdraw(P, r, n) {
  if (P === null || n <= 0) return null;
  if (r === 0) return Math.floor(P / n);
  const g = Math.pow(1 + r, n);
  return Math.floor(P * r * g / ((1 + r) * (g - 1)));
}

function drawChart(labels, dataTotal, dataPrincipal, dataWithdrawn) {
  const ctx = document.getElementById("chart").getContext("2d");
  const grad = ctx.createLinearGradient(0, 0, 0, 480);
  grad.addColorStop(0, "rgba(37,99,235,0.35)");
  grad.addColorStop(1, "rgba(37,99,235,0.02)");
  const data = {
    labels: labels,
    datasets: [
      { label: "評価額", data: dataTotal, borderColor: "#2563eb", backgroundColor: grad, fill: true, pointRadius: 0, borderWidth: 2.5, tension: 0.25 },
      { label: "元本", data: dataPrincipal, borderColor: "#94a3b8", pointRadius: 0, borderWidth: 2 },
      { label: "取り崩し累計", data: dataWithdrawn, borderColor: "#ea7a1a", pointRadius: 0, borderWidth: 2, borderDash: [6, 4] }
    ]
  };
  if (chart) { chart.data = data; chart.update("none"); return; }
  chart = new Chart(ctx, {
    type: "line",
    data: data,
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: "index", intersect: false },
      scales: {
        x: { grid: { display: false }, ticks: { color: "#6b7385", maxTicksLimit: 14 } },
        y: { grid: { color: "#eef1f6" }, ticks: { color: "#6b7385", callback: v => v.toLocaleString() + "万" } }
      },
      plugins: {
        legend: { labels: { usePointStyle: true, pointStyle: "line", color: "#1d2433" } },
        tooltip: { callbacks: { label: c => c.dataset.label + "：" + c.parsed.y.toLocaleString() + " 万円" } }
      }
    }
  });
}

document.querySelectorAll("input[type=range]").forEach(el => el.addEventListener("input", calc));
calc();
</script>
